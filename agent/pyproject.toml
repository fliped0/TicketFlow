[project]
name = "ticketflow-agent"
version = "0.3.0"
description = "Authenticated read-only TicketFlow assistant foundation"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
