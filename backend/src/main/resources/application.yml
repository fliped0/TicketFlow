spring:
  data:
    redis:
      host: ${TF_REDIS_HOST:127.0.0.1}
      port: ${TF_REDIS_PORT:16379}
      password: ${TF_REDIS_PASSWORD:}
      timeout: ${TF_REDIS_TIMEOUT:1000ms}
      connect-timeout: ${TF_REDIS_CONNECT_TIMEOUT:1000ms}
      repositories:
        enabled: false
  application:
    name: ticketflow
  datasource:
    url: jdbc:mysql://${TF_DB_HOST:127.0.0.1}:${TF_DB_PORT:3306}/${TF_DB_NAME:ticketflow_dev}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${TF_DB_USER}
    password: ${TF_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=2
  flyway:
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    cache-enabled: false
    local-cache-scope: STATEMENT
    map-underscore-to-camel-case: true
management:
  health:
    redis:
      enabled: ${TF_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: ${TF_PORT:8080}
  shutdown: graceful
ticketflow:
  async:
    enabled: ${TF_ASYNC_ENABLED:false}
    jobs-enabled: ${TF_ASYNC_JOBS_ENABLED:true}
    host: ${TF_RABBITMQ_HOST:127.0.0.1}
    port: ${TF_RABBITMQ_PORT:15673}
    username: ${TF_RABBITMQ_USER:tf_app}
    password: ${TF_RABBITMQ_PASSWORD:}
    vhost: ${TF_RABBITMQ_VHOST:/ticketflow-dev}
    broker-prefix: ${TF_RABBITMQ_PREFIX:tf.dev.async}
    query-limit: ${TF_ASYNC_QUERY_LIMIT:30}
    query-concurrency: ${TF_ASYNC_QUERY_CONCURRENCY:16}
  redis:
    enabled: ${TF_REDIS_ENABLED:false}
    namespace: ${TF_REDIS_NAMESPACE:tf:dev:v1}
    cache-ttl-seconds: ${TF_CACHE_TTL_SECONDS:30}
    empty-ttl-seconds: ${TF_CACHE_EMPTY_TTL_SECONDS:3}
    query-concurrency: ${TF_CATALOG_QUERY_CONCURRENCY:8}
    merge-wait-millis: ${TF_CACHE_MERGE_WAIT_MILLIS:500}
    user-limit: ${TF_PURCHASE_USER_LIMIT:10}
    session-limit: ${TF_PURCHASE_SESSION_LIMIT:50}
    window-millis: ${TF_PURCHASE_WINDOW_MILLIS:1000}
  observability:
    enabled: ${TF_OBSERVABILITY_ENABLED:false}
    interval-ms: ${TF_OBSERVABILITY_INTERVAL_MS:5000}
  jwt:
    private-key: ${TF_JWT_PRIVATE_KEY}
    public-key: ${TF_JWT_PUBLIC_KEY}
  admin:
    username: ${TF_ADMIN_USERNAME:}
    password: ${TF_ADMIN_PASSWORD:}
